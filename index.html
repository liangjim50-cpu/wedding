      function step(now){const dt=Math.min(now-last,50);last=now;const hotel=document.querySelector('[data-final-hotel]'),max=Math.max(0,document.documentElement.scrollHeight-innerHeight),target=Math.min(max,hotel.offsetTop+hotel.offsetHeight*(950/2600)),done=scrollY>=target-1,speed=Math.max(44,target/80);if(enabled&&!document.hidden&&now>pausedUntil&&!done)scrollTo(0,Math.min(target,scrollY+speed*dt/1000));requestAnimationFrame(step)}setControl();setMusicControl();requestAnimationFrame(step)
    })();
  </script>
</body>
