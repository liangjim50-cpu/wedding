      gate.addEventListener('click',startExperience);control.addEventListener('click',()=>{if(!started){startExperience();return}enabled=!enabled;pausedUntil=performance.now()+350;setControl();show(enabled?'已继续自动滑动':'已暂停自动滑动')});musicControl.addEventListener('click',()=>{if(!started){startExperience();return}if(audio.paused)startMusic();else audio.pause()});audio.addEventListener('play',()=>{musicOn=true;setMusicControl()});audio.addEventListener('pause',()=>{musicOn=false;setMusicControl()});audio.addEventListener('ended',()=>{musicOn=false;setMusicControl()});document.addEventListener('touchstart',e=>{if(!e.target.closest('button,a,input,textarea,label'))userTouching=true},{passive:true});document.addEventListener('touchend',()=>{userTouching=false;pausedUntil=performance.now()+300},{passive:true});document.addEventListener('touchcancel',()=>{userTouching=false;pausedUntil=performance.now()+300},{passive:true});document.addEventListener('wheel',()=>{pausedUntil=performance.now()+450},{passive:true});document.addEventListener('visibilitychange',()=>last=performance.now());
      function step(now){const dt=Math.min(now-last,80);last=now;const hotel=document.querySelector('[data-final-hotel]'),max=Math.max(0,document.documentElement.scrollHeight-innerHeight),target=Math.min(max,hotel.offsetTop+hotel.offsetHeight*(950/2600)),done=scrollY>=target-1,duration=config.motion?.autoScrollSeconds||80,speed=Math.max(44,target/duration);if(enabled&&!userTouching&&!document.hidden&&now>pausedUntil&&!done)scrollTo(0,Math.min(target,scrollY+speed*dt/1000));requestAnimationFrame(step)}setControl();setMusicControl();requestAnimationFrame(step)
    })();
  </script>
